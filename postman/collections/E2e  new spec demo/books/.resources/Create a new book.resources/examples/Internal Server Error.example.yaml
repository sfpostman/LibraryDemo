$kind: http-example
request:
  url: "{{baseUrl}}/books"
  method: POST
  headers:
    x-mock-response-code: "201"
    x-mock-response-name: Dynamic Variables Mock Demo
    Content-Type: application/json
    Accept: application/json
  body:
    type: json
    content: |-
      {
        "title": "{{tempBookTitle}}",
       "author": ""{{$randomFirstName}}" "{{$randomLastName}}"",
        "genre": "fiction",
        "yearPublished": "1967"
      }
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": 500,
          "message": "Internal Server Error"
        }
      }
order: 2000
