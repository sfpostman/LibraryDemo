$kind: http-example
request:
  url: "{{baseUrl}}/books/:id"
  method: GET
  headers:
    x-mock-response-code: "200"
    Accept: application/json
  pathVariables:
    id: "{{bookId}}"
response:
  statusCode: 500
  statusText: Internal Server Error
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": 500,
          "message": "Internal Server Error"
        }
      }
order: 3000
